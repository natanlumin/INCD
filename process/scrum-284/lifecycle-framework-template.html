<!doctype html><html><head><meta charset="utf-8"><title>Lifecycle assessment framework</title>
<style>body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="728" viewBox="0 0 1180 728" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#111">Lifecycle assessment framework</text>
  <text x="40" y="62" font-size="12.5" fill="#444">Four stages S1 to S4. At each stage questions Q about the model are answered by answerers A on the evidence E that exists at that point. Test families F map to stages.</text>
  <g font-size="13">
    <rect x="40" y="110" width="250" height="310" rx="6" fill="#f4f6fa" stroke="#334" stroke-width="1.4"/>
    <rect x="40" y="110" width="250" height="36" rx="6" fill="#334"/>
    <text x="165" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">S1  Selection</text>
    <text x="54" y="168" font-weight="bold" font-size="12.5">Q</text><text x="74" y="168" font-size="11.5" fill="#333">questions answered here</text>
    <text x="74" y="184" font-size="10.5" fill="#222"><tspan font-weight="bold">Q1.1</tspan> where it lives, who produced it</text>
    <text x="74" y="200" font-size="10.5" fill="#222"><tspan font-weight="bold">Q1.2</tspan> file as the page says</text>
    <text x="74" y="216" font-size="10.5" fill="#222"><tspan font-weight="bold">Q1.3</tspan> can loading it harm us</text>
    <text x="74" y="232" font-size="10.5" fill="#222"><tspan font-weight="bold">Q1.4</tspan> may we use it</text>
    <text x="74" y="248" font-size="10.5" fill="#222"><tspan font-weight="bold">Q1.5</tspan> segmentation row and column</text>
    <text x="74" y="264" font-size="10.5" fill="#222"><tspan font-weight="bold">Q1.6</tspan> behaves as described, safeguard</text>
    <text x="54" y="288" font-weight="bold" font-size="12.5">A</text><text x="74" y="288" font-size="10.5" fill="#222">platform, producer, organisation</text>
    <text x="54" y="312" font-weight="bold" font-size="12.5">E</text><text x="74" y="312" font-size="10.5" fill="#222">E1 = {e1.1 … e1.10}</text>
    <text x="74" y="327" font-size="10.5" fill="#555">guaranteed: account, hashes, scan, gating</text>
    <text x="74" y="342" font-size="10.5" fill="#555">declared: model card, licence</text>
    <text x="74" y="357" font-size="10.5" fill="#555">readable: format, code, own scan</text>
    <text x="74" y="372" font-size="10.5" fill="#555">testable: outputs, internals</text>
    <text x="54" y="396" font-weight="bold" font-size="12.5">M</text><text x="74" y="396" font-size="10.5" fill="#222">F1 F2 F3 F4: all four families</text>
    <rect x="330" y="110" width="250" height="310" rx="6" fill="#f4f6fa" stroke="#334" stroke-width="1.4"/>
    <rect x="330" y="110" width="250" height="36" rx="6" fill="#334"/>
    <text x="455" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">S2  Adjustment</text>
    <text x="344" y="168" font-weight="bold" font-size="12.5">Q</text><text x="364" y="168" font-size="11.5" fill="#333">questions answered here</text>
    <text x="364" y="184" font-size="10.5" fill="#222"><tspan font-weight="bold">Q2.1</tspan> what changed, from which base</text>
    <text x="364" y="200" font-size="10.5" fill="#222"><tspan font-weight="bold">Q2.2</tspan> anything carried in</text>
    <text x="364" y="216" font-size="10.5" fill="#222"><tspan font-weight="bold">Q2.3</tspan> safeguard still present</text>
    <text x="364" y="232" font-size="10.5" fill="#222"><tspan font-weight="bold">Q2.4</tspan> still the segmentation, still the job</text>
    <text x="344" y="256" font-weight="bold" font-size="12.5">A</text><text x="364" y="256" font-size="10.5" fill="#222">organisation; party that made the change</text>
    <text x="344" y="280" font-weight="bold" font-size="12.5">E</text><text x="364" y="280" font-size="10.5" fill="#222">E2 = E1 ∪ {e2.1 … e2.5}</text>
    <text x="364" y="295" font-size="10.5" fill="#555">readable: artefact, own record</text>
    <text x="364" y="310" font-size="10.5" fill="#555">declared: other party's account</text>
    <text x="364" y="325" font-size="10.5" fill="#555">testable: outputs, internals</text>
    <text x="344" y="349" font-weight="bold" font-size="12.5">M</text><text x="364" y="349" font-size="10.5" fill="#222">F1 F2 F3</text>
    <rect x="620" y="110" width="250" height="310" rx="6" fill="#f4f6fa" stroke="#334" stroke-width="1.4"/>
    <rect x="620" y="110" width="250" height="36" rx="6" fill="#334"/>
    <text x="745" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">S3  Deployment</text>
    <text x="634" y="168" font-weight="bold" font-size="12.5">Q</text><text x="654" y="168" font-size="11.5" fill="#333">questions answered here</text>
    <text x="654" y="184" font-size="10.5" fill="#222"><tspan font-weight="bold">Q3.1</tspan> served model = assessed model</text>
    <text x="654" y="200" font-size="10.5" fill="#222"><tspan font-weight="bold">Q3.2</tspan> what surrounds it, does it change it</text>
    <text x="654" y="216" font-size="10.5" fill="#222"><tspan font-weight="bold">Q3.3</tspan> same outputs through the stack</text>
    <text x="654" y="232" font-size="10.5" fill="#222"><tspan font-weight="bold">Q3.4</tspan> who can reach it</text>
    <text x="634" y="256" font-weight="bold" font-size="12.5">A</text><text x="654" y="256" font-size="10.5" fill="#222">organisation; serving provider by proxy</text>
    <text x="634" y="280" font-weight="bold" font-size="12.5">E</text><text x="654" y="280" font-size="10.5" fill="#222">E3 = E2 ∪ {e3.1 … e3.7}</text>
    <text x="654" y="295" font-size="10.5" fill="#555">readable: hash, stack, access</text>
    <text x="654" y="310" font-size="10.5" fill="#555">declared: version, configuration, access</text>
    <text x="654" y="325" font-size="10.5" fill="#555">testable outputs: through the endpoint</text>
    <text x="634" y="349" font-weight="bold" font-size="12.5">M</text><text x="654" y="349" font-size="10.5" fill="#222">F1 F3</text>
    <rect x="910" y="110" width="250" height="310" rx="6" fill="#f4f6fa" stroke="#334" stroke-width="1.4"/>
    <rect x="910" y="110" width="250" height="36" rx="6" fill="#334"/>
    <text x="1035" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">S4  Runtime detection</text>
    <text x="924" y="168" font-weight="bold" font-size="12.5">Q</text><text x="944" y="168" font-size="11.5" fill="#333">questions answered here</text>
    <text x="944" y="184" font-size="10.5" fill="#222"><tspan font-weight="bold">Q4.1</tspan> anything changed since</text>
    <text x="944" y="200" font-size="10.5" fill="#222"><tspan font-weight="bold">Q4.2</tspan> inputs turning it, does it comply</text>
    <text x="944" y="216" font-size="10.5" fill="#222"><tspan font-weight="bold">Q4.3</tspan> same outputs as when accepted</text>
    <text x="944" y="232" font-size="10.5" fill="#222"><tspan font-weight="bold">Q4.4</tspan> who reaches it, how much</text>
    <text x="924" y="256" font-weight="bold" font-size="12.5">A</text><text x="944" y="256" font-size="10.5" fill="#222">organisation; serving provider by proxy</text>
    <text x="924" y="280" font-weight="bold" font-size="12.5">E</text><text x="944" y="280" font-size="10.5" fill="#222">E4 = E3 ∪ {e4.1 … e4.6}</text>
    <text x="944" y="295" font-size="10.5" fill="#555">readable: re-read of hash, stack, access</text>
    <text x="944" y="310" font-size="10.5" fill="#555">declared: change notices, usage</text>
    <text x="944" y="325" font-size="10.5" fill="#555">testable outputs: traffic, repeat</text>
    <text x="924" y="349" font-weight="bold" font-size="12.5">M</text><text x="944" y="349" font-size="10.5" fill="#222">F1 F3</text>
  </g>
  <g stroke="#333" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <line x1="290" y1="296" x2="328" y2="296"/>
    <line x1="580" y1="296" x2="618" y2="296"/>
    <line x1="870" y1="296" x2="908" y2="296"/>
  </g>
  <g>
    <line x1="40" y1="460" x2="1160" y2="460" stroke="#a33" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="40" y="452" font-size="12.5" fill="#a33" font-weight="bold">Access line H: what the organisation holds, decided at or before S3</text>
    <rect x="40" y="476" width="540" height="72" rx="6" fill="#fff6f6" stroke="#a33" stroke-width="1.2"/>
    <text x="56" y="500" font-size="13" font-weight="bold" fill="#111">H = file  (in possession)</text>
    <text x="56" y="520" font-size="12" fill="#333">the file and its internals are at hand: white-box and black-box methods both run</text>
    <text x="56" y="538" font-size="12" fill="#333">E(S) = E_guaranteed(S) ∪ E_declared(S) ∪ E_readable(S) ∪ E_testable(S)</text>
    <rect x="620" y="476" width="540" height="72" rx="6" fill="#fff6f6" stroke="#a33" stroke-width="1.2"/>
    <text x="636" y="500" font-size="13" font-weight="bold" fill="#111">H = key  (by proxy)</text>
    <text x="636" y="520" font-size="12" fill="#333">only the serving provider's statements and the outputs: black-box only; every declared item is a gap</text>
    <text x="636" y="538" font-size="12" fill="#333">E(S) = E_declared(S) ∪ E_testable outputs(S)</text>
  </g>
  <g>
    <rect x="40" y="574" width="1120" height="124" rx="6" fill="#f7f7f2" stroke="#776" stroke-width="1.2"/>
    <text x="56" y="598" font-size="13.5" font-weight="bold" fill="#111">Methods M, grouped by test family F, each mapped to at least one stage</text>
    <text x="56" y="622" font-size="12.5" fill="#222">F1 static reads readable items  · F2 dynamic measures internals  · F3 behavioural measures outputs  · F4 provenance checks guaranteed items</text>
    <text x="56" y="646" font-size="12.5" fill="#222">map(Mi) = the stages whose inventory En holds an item of the kind Mi reads, and at which Mi's access need is met;  map(Mi) ≠ ∅</text>
    <text x="56" y="670" font-size="12.5" fill="#222">by proxy only F3 remains; F1, F2 and F4 need the file and drop out at every stage</text>
    <text x="56" y="690" font-size="11.5" fill="#555">Working figure, 12 October 2026; question texts in the stage tables; verified against them by the consistency check</text>
  </g>
</svg>
</body></html>
